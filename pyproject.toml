[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raredecay"
version = "3.0.0"
description = "A package with multivariate analysis and reweighting algorithms"
readme = "README.rst"
license = "Apache-2.0"
requires-python = ">=3.6"
authors = [
    { name = "Jonas Eschle", email = "Jonas.Eschle@cern.ch" },
]
keywords = [
    "particle physics",
    "analysis",
    "machine learning",
    "reweight",
    "high energy physics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "hep_ml>=0.5.0",
    "matplotlib",
    "numpy",
    "pandas",
    "rep @ git+https://github.com/REPlegacy/rep",
    "scikit-learn~=0.19.0",
    "scipy",
    "seaborn",
    "uproot",
    "xgboost<1.3",
]

[project.optional-dependencies]
root = ["root-numpy", "rootpy"]

[project.urls]
Homepage = "https://github.com/jonas-eschle/raredecay"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["raredecay"]
